<!--
  Amado Blends — código de acceso
  Supabase → Authentication → Emails → Magic Link

  Pega ESTE archivo entero en el cuadro de la plantilla.

  ── Lo único que no se puede quitar ──────────────────────────────────────
  {{ .Token }} es lo que decide todo. Supabase manda un CÓDIGO si la
  plantilla lo contiene, y un ENLACE si no. La plantilla por defecto no lo
  tiene: por eso llegaba "Your sign-in link" y nunca los 6 dígitos que la
  app pide.

  ── Por qué está escrito así ─────────────────────────────────────────────
  Tablas y estilos en línea, no flexbox ni hojas de estilo: Outlook y Gmail
  descartan casi todo el CSS moderno, y un correo que se ve bien en el
  navegador puede llegar deshecho. Esto es feo de escribir y fiable de leer.
-->
<table width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#0b0b0d;padding:32px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table width="100%" cellpadding="0" cellspacing="0" border="0"
             style="max-width:440px;background:#141416;border-radius:20px;overflow:hidden;">

        <!-- Marca -->
        <tr>
          <td align="center" style="padding:36px 32px 8px;">
            <div style="font-size:22px;font-weight:800;color:#ffffff;letter-spacing:-0.4px;">
              Amado Blends
            </div>
            <div style="width:36px;height:3px;background:#ff6a3d;margin:10px auto 0;border-radius:2px;"></div>
          </td>
        </tr>

        <!-- Qué es esto -->
        <tr>
          <td align="center" style="padding:20px 32px 0;">
            <div style="font-size:17px;font-weight:700;color:#ffffff;">
              Tu código de acceso
            </div>
            <div style="font-size:14px;color:#9a9aa2;line-height:1.55;padding-top:8px;">
              Escríbelo en la app para entrar.
            </div>
          </td>
        </tr>

        <!-- El código. Es lo único que la persona necesita de aquí. -->
        <tr>
          <td align="center" style="padding:24px 32px 8px;">
            <div style="display:inline-block;padding:18px 30px;background:#0b0b0d;border:1px solid #2a2a30;border-radius:16px;">
              <span style="font-size:34px;font-weight:800;letter-spacing:0.22em;color:#ffffff;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</span>
            </div>
          </td>
        </tr>

        <tr>
          <td align="center" style="padding:4px 32px 0;">
            <div style="font-size:12px;color:#6e6e76;">
              Caduca en 10 minutos y solo sirve una vez.
            </div>
          </td>
        </tr>

        <!-- Aviso de seguridad. Corto: si no lo pediste, no hay que hacer nada. -->
        <tr>
          <td style="padding:28px 32px 0;">
            <div style="height:1px;background:#242429;"></div>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:18px 32px 32px;">
            <div style="font-size:12px;color:#6e6e76;line-height:1.6;">
              Si no pediste este código, puedes ignorar este correo.
              Nadie puede entrar sin él.
            </div>
          </td>
        </tr>
      </table>

      <div style="font-size:11px;color:#4a4a52;padding-top:18px;">
        Amado Blends Barbershop
      </div>
    </td>
  </tr>
</table>
